<aside class="filter-panel">

  <div class="filter-header">
    <span class="filter-title">VOS CRITÈRES</span>
    <button class="reset-btn" (click)="reinitialiser()">↺ Réinitialiser</button>
  </div>

  <!-- Budget -->
  <div class="filter-section">
    <label class="section-label">Budget maximum</label>
    <input
      type="range"
      class="range-slider"
      min="300"
      max="3000"
      step="50"
      [(ngModel)]="prixMax"
      (ngModelChange)="onChange()"
    />
    <div class="range-labels">
      <span>300 €</span>
      <span class="range-value">{{ prixMax }} €</span>
      <span>3 000 €</span>
    </div>
  </div>

  <!-- CPU -->
  <div class="filter-section">
    <label class="section-label">Processeur (CPU)</label>
    <div class="checkbox-list">
      <label class="checkbox-item">
        <input type="radio" name="cpu" value="" [(ngModel)]="cpu" (ngModelChange)="onChange()" />
        <span>Peu importe</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="cpu" value="i5" [(ngModel)]="cpu" (ngModelChange)="onChange()" />
        <span>Intel Core i5</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="cpu" value="i7" [(ngModel)]="cpu" (ngModelChange)="onChange()" />
        <span>Intel Core i7</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="cpu" value="ryzen" [(ngModel)]="cpu" (ngModelChange)="onChange()" />
        <span>AMD Ryzen</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="cpu" value="apple" [(ngModel)]="cpu" (ngModelChange)="onChange()" />
        <span>Apple Silicon</span>
      </label>
    </div>
  </div>

  <!-- RAM -->
  <div class="filter-section">
    <label class="section-label">RAM minimum</label>
    <div class="checkbox-list">
      <label class="checkbox-item">
        <input type="radio" name="ram" [value]="8" [(ngModel)]="ramMin" (ngModelChange)="onChange()" />
        <span>8 Go</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="ram" [value]="16" [(ngModel)]="ramMin" (ngModelChange)="onChange()" />
        <span>16 Go</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="ram" [value]="32" [(ngModel)]="ramMin" (ngModelChange)="onChange()" />
        <span>32 Go</span>
      </label>
    </div>
  </div>

  <!-- SSD -->
  <div class="filter-section">
    <label class="section-label">Stockage minimum</label>
    <div class="checkbox-list">
      <label class="checkbox-item">
        <input type="radio" name="ssd" [value]="256" [(ngModel)]="ssdMin" (ngModelChange)="onChange()" />
        <span>256 Go SSD</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="ssd" [value]="512" [(ngModel)]="ssdMin" (ngModelChange)="onChange()" />
        <span>512 Go SSD</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="ssd" [value]="1000" [(ngModel)]="ssdMin" (ngModelChange)="onChange()" />
        <span>1 To SSD</span>
      </label>
    </div>
  </div>

  <!-- GPU -->
  <div class="filter-section">
    <label class="section-label">Carte graphique</label>
    <div class="checkbox-list">
      <label class="checkbox-item">
        <input type="radio" name="gpu" value="tous" [(ngModel)]="gpuType" (ngModelChange)="onChange()" />
        <span>Peu importe</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="gpu" value="integree" [(ngModel)]="gpuType" (ngModelChange)="onChange()" />
        <span>Intégrée</span>
      </label>
      <label class="checkbox-item">
        <input type="radio" name="gpu" value="dediee" [(ngModel)]="gpuType" (ngModelChange)="onChange()" />
        <span>Dédiée (gaming / 3D)</span>
      </label>
    </div>
  </div>

</aside>
