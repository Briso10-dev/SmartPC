<div class="question-card">
  <div class="card-header">
    <h2 class="question-title">{{ title }}</h2>
    <div class="help-icon">?</div>
  </div>

  <div class="answers">
    <ng-content></ng-content>
  </div>

  <app-edu-tooltip
    *ngIf="mode === 'guided' && tooltip"
    [text]="tooltip"
  ></app-edu-tooltip>
</div>
